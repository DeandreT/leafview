<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Folio · PDF preview</title>
<style>
body{font:16px system-ui;margin:auto;max-width:960px;padding:1rem;background:#f2f2f2;color:#161616}
header{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;margin-bottom:1rem}
canvas{display:block;width:100%;height:auto}button,input{font:inherit}output{font-variant-numeric:tabular-nums}
</style>
<header><label>Open PDF <input type="file" accept="application/pdf" id="file"></label>
<button id="prev" disabled>Previous</button><button id="next" disabled>Next</button>
<output id="status" aria-live="polite">Choose a local PDF.</output></header>
<main></main>
<script type="module">
import {openDocument} from "./wasm-engine.js";
const $ = s => document.querySelector(s);
let doc, page = 0, serial = 0;
function buttons() {
  $("#prev").disabled = !doc || page <= 1;
  $("#next").disabled = !doc || page >= doc.pageCount;
}
async function show(n) {
  const id = ++serial;
  page = n; buttons();
  $("#status").textContent = `Rendering page ${n}…`;
  const canvas = document.createElement("canvas");
  try {
    await doc.render(n, 900, canvas);
    if (id !== serial) return;
    canvas.setAttribute("aria-label", `Page ${n}`);
    $("main").replaceChildren(canvas);
    $("#status").textContent = `Page ${n} of ${doc.pageCount}`;
  } catch (error) { if (id === serial) $("#status").textContent = String(error); }
}
$("#file").onchange = async e => {
  const id = ++serial, old = doc;
  doc = undefined; page = 0; buttons(); $("main").replaceChildren();
  if (old) await old.destroy();
  const file = e.target.files[0];
  if (!file || id !== serial) return;
  $("#status").textContent = "Opening…";
  const url = URL.createObjectURL(file);
  try {
    const opened = await openDocument(url);
    if (id !== serial) { await opened.destroy(); return; }
    doc = opened;
    await show(1);
  } catch (error) { if (id === serial) $("#status").textContent = String(error); }
  finally { URL.revokeObjectURL(url); }
};
$("#prev").onclick = () => show(page - 1);
$("#next").onclick = () => show(page + 1);
</script>
</html>
