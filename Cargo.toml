[package]
name = "folio-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
license = "GPL-3.0-only"

[lib]
crate-type = ["cdylib"]

[dependencies]
hayro = "=0.9.0"
self_cell = "1.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
